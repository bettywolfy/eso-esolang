  <script>
function encodeBase64(code) {
  return LZString.compressToBase64(code)
    .replaceAll("+", "-")
    .replaceAll("/", "_")
    .replaceAll("=", "");
}
function decodeBase64(code) {
  code = code
    .replaceAll("-", "+")
    .replaceAll("_", "/");
  return LZString.decompressFromBase64(code);
}

const elt_code = document.querySelector("#code");
const elt_run = document.querySelector("#run");
const elt_stdout = document.querySelector("#stdout");
const elt_status = document.querySelector("#status");

elt_run.onclick = async () => {
  if(hand_in) hand_in = null;
  
  const url_code = encodeBase64(elt_code.value);
  window.history.replaceState({}, "", "?code="+url_code);
  
  await runEso(elt_code.value);
}

elt_enter.onclick = async () => {
  if(!hand_in) return;
  await hand_in(elt_stdin.value);

  // elt_run.disabled = false;

}
function prompt(stdout) {
  const inpi = /\S$/.test(stdout)?" ":"";
  elt_stdout.value = stdout+inpi+"[program is waiting for stdin]";
  // elt_run.disabled = true;
  return new Promise(res => hand_in = res);
}

/* eso interpreter */
function parseEso(code) {
  let idx = 0;
  function parseNext(tokens) {
    if(code[idx]==="¢") {
      while(idx<code.length && code[idx]!=="\n") ++idx;
      return;
    }
    
    if(code[idx]==='"') {
      let start = idx++, value = "";
      while(idx<code.length && code[idx]!=='"') {
        if(code[idx]==="\\") {
          ++idx;
          if(idx>=code.length) {
            throw new SyntaxError(
              "expected character after backslash escape but the input ended → "
                +code.slice(start, idx)
            );
          }
          if(code[idx]==="n") value += "\n";
          else if(code[idx]==="t") value += "\t";
          else value += code[idx];
          ++idx;
          continue;
        }
        value += code[idx++];
      }
      const raw = code.slice(start, idx+1);
      if(code[idx]!=='"') {
        throw new SyntaxError("unmatched pair of quotation marks → "+raw);
      }
      ++idx;
      tokens.push({ type: "string", raw, value });
      return;
    }
    
    if(code[idx]==="'") {
      ++idx;
      if(idx>=code.length) {
        throw new SyntaxError("expected character after ' but the input ended");
      }
      const char = code[idx++];
      tokens.push({ type: "char", value: BigInt(char.codePointAt(0)), raw: "'"+char });
      return;
    }
    
    if(code[idx]==="[") {
      const start = idx++;
      
      const body = [];
      while(idx<code.length && code[idx]!=="]") {
        parseNext(body);
      }
      const raw = code.slice(start, idx+1);
      if(code[idx]!=="]") {
        throw new SyntaxError("unmatched pair of brackets → "+raw);
      }
      ++idx;
      tokens.push({ type: "loop", body, raw });
      return;
    }
    
    if(code[idx]==="(") {
      const start = idx++;
      
      const body = [];
      while(idx<code.length && code[idx]!==")") {
        parseNext(body);
      }
      const raw = code.slice(start, idx+1);
      if(code[idx]!==")") {
        throw new SyntaxError("unmatched pair of parenthesis → "+raw);
      }
      ++idx;
      tokens.push({ type: "group", body, raw });
      return;
    }
    
    if(/\s/.test(code[idx])) {
      ++idx;
      return;
    }
    
    if(/[0-9]/.test(code[idx])) {
      let raw = "";
      while(idx<code.length && /[0-9]/.test(code[idx])) {
        raw += code[idx++];
      }
      tokens.push({ type: "number", raw, value: BigInt(raw) });
      return;
    }
    
    if("$#!?+-*/%~`^v&:;.@><o".includes(code[idx])) {
      const type = code[idx];
      tokens.push({
        type, raw: type,
        start: idx, end: ++idx
      });
      return;
    }
    
    throw new SyntaxError("invalid symbol → "+code[idx]);
  }
  
  const tokens = [];
  while(idx<code.length) {
    parseNext(tokens);
  }
  return tokens;
}

async function runEso(code) {
  function binop(i) {
    if(stack.length<2) {
      throw new Error("expected 2 operands to do binary operation");
    }
    const right = stack.pop();
    const left = stack.pop();
    stack.push(i(left, right));
  }
  function unaop(i) {
    if(stack.length<1) {
      throw new Error("expected a value to do unary operation");
    }
    const l = stack.length-1;
    stack[l] = i(stack[l]);
  }
  
  let stdout = "", stored = [], stack = [];
  async function interpret(op) {
    switch(op.type) {
      // literals
      case "number": {
        stack.push(op.value);
        return;
      }
      case "string": {
        stdout += op.value;
        return;
      }
      case "char":
        stack.push(op.value);
        return;
      
      // flow
      case "loop": {
        let fuel = 0xffffff;
        while(fuel && stack.length && stack[stack.length-1]) {
          for(const op2 of op.body) {
            await interpret(op2);
          }
          --fuel;
        }
        if(!fuel) {
          throw new Error("too many interactions → "+op.raw);
        }
        return;
      }
      case "group": {
        const backup = stored;
        stored = [];
        for(const op2 of op.body) {
          await interpret(op2);
        }
        stored = backup;
        break;
      }
      
      // stdin
      case "?": {
        let u;
        try {
          u = BigInt(await prompt(stdout));
        } catch(e) {
          u = 0n;
        }
        stack.push(u);
        break;
      }
      case "!": {
        let u = await prompt(stdout);
        if(!u.length) {
          stack.push(0n);
          break;
        }
        u = [...u];
        for(const c of u) {
          stack.push(BigInt(c.codePointAt(0)));
        }
        stack.push(BigInt(u.length));
        break;
      }
      
      // stdout
      case "#": {
        if(stack.length) {
          stdout += stack.pop();
          break;
        }
        throw new Error("expected number to print");
      }
      case "o": {
        stdout += stack.join(" ");
        return;
      }
      case "$": {
        if(stack.length) {
          stdout += String.fromCodePoint(Number(stack.pop()));
          break;
        }
        throw new Error("expected codepoint to print");
      }
      
      // operations
      case "+": binop((i, j) => i+j); break;
      case "-": binop((i, j) => i-j); break;
      case "*": binop((i, j) => i*j); break;
      case "/": binop((i, j) => {
        if(j===0n) {
          throw new Error("can't divide by 0");
        }
        return i/j;
      }); break;
      case "%": binop((i, j) => {
        if(j===0n) {
          throw new Error("can't divide by 0");
        }
        return i%j;
      }); break;
      case "~": unaop(i => (i===0n) ? 1n : 0n); break;
      case "`": unaop(i => (i<0n) ? -1n : ((i>0n) ? 1n : 0n)); break;
      
      // stack
      case "@":
        stack.push(BigInt((2*Math.random())|0));
        break;
      case "v":
        stack.pop();
        break;
      case "&": {
        if(!stack.length) {
          throw new Error("can't pop empty stack");
        }
        stored.push(stack.pop());
        return;
      }
      case "^": {
        if(!stack.length) {
          throw new Error("can't duplicate empty stack");
        }
        stack.push(stack[stack.length-1]);
        break;
      }
      case ":": {
        if(stack.length<2) {
          throw new Error("expected at least 2 on stack to swap");
        }
        const l = stack.length-1;
        const u = stack[l];
        stack[l] = stack[l-1];
        stack[l-1] = u;
        break;
      }
      case ";": {
        if(stack.length<2) {
          throw new Error("expected 2 depth value");
        }
        const d1 = Number(stack.pop());
        const d2 = Number(stack.pop());
        const l = stack.length;
        if(l+1<=d1 || l+1<=d2 || d1<1 || d2<1 || d1===d2) {
          throw new Error("can't swap at depth "+d1+" and "+d2);
        }
        const idx0 = l-d1, idx1 = l-d2;
        const u = stack[idx0];
        stack[idx0] = stack[idx1];
        stack[idx1] = u;
        break;
      }
      case ".": {
        if(!stack.length) {
          throw new Error("expected reverse size on stack");
        }
        const size = Number(stack.pop());
        if(stack.length<size) {
          throw new Error("expected at least "+size+" on stack to reverse");
        }
        const original = stack.splice(stack.length-size, stack.length);
        stack.push(...original.reverse());
        break;
      }
      case ">": {
        if(!stack.length) {
          throw new Error("expected depth value");
        }
        const depth = Number(stack.pop());
        const l = stack.length;
        if(depth>l) {
          throw new Error("expected at least "+depth+" on stack to push up");
        }
        stack.push(...stack.splice(l-depth, 1));
        break;
      }
      case "<": {
        if(!stack.length) {
          throw new Error("expected depth value");
        }
        const depth = Number(stack.pop());
        const l = stack.length;
        if(depth>l) {
          throw new Error("expected at least "+depth+" on stack to push down");
        }
        stack.splice(l-depth, 0, stack.pop());
        break;
      }
      default:
        throw new SyntaxError("invalid symbol → "+op.raw);
    }
    if(stored.length) {
      stack.push(...stored.splice(0).reverse());
    }
  }
  
  elt_status.style.color = "white";
  elt_status.value = "";
  try {
    for(const op of parseEso(code)) {
      await interpret(op);
    }
    elt_status.value = "closed with stack at "+stack.length;
    elt_status.style.color = stack.length
      ? "khaki" : "palegreen";
  } catch(e) {
    elt_status.value = e.toString();
    elt_status.style.color = "orangered";
  }
  elt_stdout.value = stdout;
}
