  <script>
function encodeBase64(code) {
  return LZString.compressToBase64(code)
    .replaceAll("+", "-")
    .replaceAll("/", "_")
    .replaceAll("=", "");
}
function decodeBase64(code) {
  code = code
    .replaceAll("-", "+")
    .replaceAll("_", "/");
  return LZString.decompressFromBase64(code);
}

}

/* eso interpreter */
function parseEso(code) {
  // lexer phase
  const tokens = [];
  let idx = 0;
  while(idx<code.length) {
    // ignore
    if(/\s/.test(code[idx])) {
      while(idx<code.length && /\s/.test(code[idx])) ++idx;
      continue;
    }
    
    // commentary
    if(code[idx]==="¢") {
      while(idx<code.length && code[idx]!=="\n") ++idx;
      continue;
    }
    
    // number
    if(/[0-9]/.test(code[idx])) {
      let start = idx, raw = "";
      while(idx<code.length && /[0-9]/.test(code[idx])) {
        raw += code[idx++];
      }
      tokens.push({
        type: "num", raw,
        value: BigInt(raw),
        start, end: idx
      });
      continue;
    }
    
    // string
    if(code[idx]==='"') {
      let start = idx++, value = "";
      while(idx<code.length && code[idx]!=='"') {
        if(code[idx]==="\\") {
          ++idx;
          if(idx>=code.length) {
            throw new SyntaxError(
              "expected character after backslash escape but the input ended → "
                +code.slice(start, idx)
            );
          }
          if(code[idx]==="n") value += "\n";
          else if(code[idx]==="t") value += "\t";
          else value += code[idx];
          ++idx;
          continue;
        }
        value += code[idx++];
      }
      if(code[idx]!=='"') {
        throw new SyntaxError(
          "unmatched pair of quotation marks → "
            +code.slice(start, idx)
        );
      }
      tokens.push({
        type: "str", raw: code.slice(start, ++idx),
        value, start, end: idx
      });
      continue;
    }
    
    // char (why didn't i added this before?)
    if(code[idx]==="'") {
      const start = idx++;
      if(idx>code.length) {
        throw new SyntaxError("expected character after ' but the input ended.");
      }
      tokens.push({
        type: "char",
        value: BigInt(code[idx].codePointAt(0)),
        raw: code.slice(start, ++idx),
        start, end: idx
      });
      continue;
    }
    
    // operators
    if("$#!?+-*/%~`^v&:;.@><o[]()".includes(code[idx])) {
      const type = code[idx];
      tokens.push({
        type, raw: type,
        start: idx, end: ++idx
      });
      continue;
    }
    
    /*if(/[a-z]/.test(code[idx])) {
      const raw = code[idx];
      tokens.push({
        type: "macro", raw,
        start: idx, end: ++idx
      });
      continue;
    }*/
    
    throw new SyntaxError("invalid symbol → "+code[idx]);
  }
  
  // parser phase
  function parseToken() {
    const next = tokens.shift();
    
    // loop
    /*if(next.type==="="||next.type===";") {
      throw new SyntaxError("macros are only allowed in the top-level and on the header.");
    }*/
    if(next.type==="[") {
      const start = next.start;
      
      const body = [];
      while(tokens.length && tokens[0].type!=="]") {
        body.push(parseToken());
      }
      
      let end = start+1;
      if(!tokens.length) {
        if(!body.length) end = start+1;
        else end = body[body.length-1].end;
      } else {
        end = tokens[0].end;
      }
      
      if(tokens.shift()?.type!=="]") {
        throw new SyntaxError(
          "unmatched pair of brackets → "
            +code.slice(start, Math.min(20+start, end))
        );
      }
      return {
        type: "loop", body,
        raw: code.slice(start, end),
        start, end
      };
    }
    
    // group
    if(next.type==="(") {
      const start = next.start;
      
      const body = [];
      while(tokens.length && tokens[0].type!==")") {
        body.push(parseToken());
      }
      
      let end;
      if(!tokens.length) {
        if(!body.length) end = start+1;
        else end = body[body.length-1].end;
      } else {
        end = tokens[0].end;
      }
      
      if(tokens.shift()?.type!==")") {
        throw new SyntaxError(
          "unmatched pair of parenthesesis → "
            +code.slice(start, Math.min(20+start, end))
        );
      }
      return {
        type: "group", body,
        value: code.slice(start, end),
        start, end
      };
    }
    
    return next;
  }
  const parsed = [];
  
  /*while(tokens.length && tokens[0].type==="=") {
    const start = tokens.shift().start;
    
    // macro name
    if(!tokens.length) {
      throw new SyntaxError("expected macro symbol but the input ended.");
    }
    let name = tokens.shift();
    if(name.type!=="macro") {
      throw new SyntaxError(`expected macro symbol but received '${name.raw.slice(0, 20)}'`);
    }
    if(!tokens.length) {
      throw new SyntaxError(`expected a group for macro '${name.raw}' body but the input ended.`);
    }
    name = name.raw;
    
    // macro bodg
    const body = [];
    while(tokens.length && tokens[0].type!==";") {
      body.push(parseToken());
    }
    
    let end;
    if(!tokens.length) {
      if(!body.length) end = start+1;
      else end = body[body.length-1].end;
    } else {
      end = tokens[0].end;
    }
    
    if(tokens.shift()?.type!==";") {
      throw new SyntaxError(
        "unterminated macro body → "
          +code.slice(start, Math.min(20+start, end))
      );
    }
    
    const raw = code.slice(start, end);
    parsed.push({
      type: "macro_def", raw,
      name, body,
      start, end
    });
  }*/
  
  while(tokens.length) {
    parsed.push(parseToken());
  }
  
  return parsed;
}

async function runEso(code) {
  function binop(i) {
    if(stack.length<2) {
      throw new Error("expected 2 operands for binary operation.");
    }
    stack.push(i(stack.pop(), stack.pop()));
  }
  function unaop(i) {
    if(stack.length<1) {
      throw new Error("expected a value for unary operation.");
    }
    const l = stack.length-1;
    stack[l] = i(stack[l]);
  }
  
  let stdout = "";
  let popst = [];
  const stack = [];

  // const macros = new Map();
  
  async function interpret(op) {
    switch(op.type) {
      // macros
      /*case "macro": {
        const f = macros.get(op.raw);
        if(!f) {
          throw new Error(`couldn't find a macro named '${op.raw}'`);
        }
        for(const op2 of f) {
          await interpret(op2);
        }
        break;
      }
      case "macro_def": {
        macros.set(op.name, op.body);
        return;
      }*/
      
      // literals
      case "num": {
        stack.push(op.value);
        return;
      }
      case "str": {
        stdout += op.value;
        return;
      }
      case "char":
        stack.push(op.value);
        return;
      
      // flow
      case "loop": {
        let fuel = 0xffffff;
        while(fuel && stack.length && stack[stack.length-1]) {
          for(const op2 of op.body) {
            await interpret(op2);
          }
          --fuel;
        }
        if(!fuel) {
          throw new Error("too many interactions → "+op.raw);
        }
        return;
      }
      case "group": {
        let i = 1, j = popst.length+1;
        const backup = popst;
        popst = [];
        for(const op2 of op.body) {
          await interpret(op2);
        }
        popst = backup;
        break;
      }
      
      // stdin
      case "?": {
        let u;
        try {
          u = BigInt(await prompt(stdout));
        } catch(e) {
          u = 0n;
        }
        stack.push(u);
        break;
      }
      case "!": {
        let u = await prompt(stdout);
        if(!u.length) {
          stack.push(0n);
          break;
        }
        u = [...u];
        for(const c of u) {
          stack.push(BigInt(c.codePointAt(0)));
        }
        stack.push(BigInt(u.length));
        break;
      }
      
      // stdout
      case "#": {
        if(stack.length) {
          stdout += stack.pop();
          break;
        }
        throw new Error("expected value to print.");
      }
      case "o": {
        stdout += stack.join(" ");
        return;
      }
      case "$": {
        if(stack.length) {
          stdout += String.fromCodePoint(Number(stack.pop()));
          break;
        }
        throw new Error("expected value to print.");
      }
      
      // operations
      case "+": binop((i, j) => i+j); break;
      case "-": binop((i, j) => j-i); break;
      case "*": binop((i, j) => i*j); break;
      case "/": binop((i, j) => j/i); break;
      case "%": binop((i, j) => j%i); break;
      case "~": unaop(i => (i===0n) ? 1n : 0n); break;
      case "`": unaop(i => (i<0n) ? (-1n) : ((i>0n) ? 1n : 0n)); break;
      
      // stack
      case "@":
        stack.push(BigInt((2*Math.random())|0));
        break;
      case "v":
        stack.pop();
        break;
      case "&": {
        if(!stack.length) {
          throw new Error("expected value to pop.");
        }
        popst.push(stack.pop());
        return;
      }
      case "^": {
        if(!stack.length) {
          throw new Error("expected value to duplicate.");
        }
        stack.push(stack[stack.length-1]);
        break;
      }
      case ":": {
        if(stack.length<2) {
          throw new Error("expected at least 2 values to swap.");
        }
        const l = stack.length-1;
        const u = stack[l];
        stack[l] = stack[l-1];
        stack[l-1] = u;
        break;
      }
      case ";": {
        if(stack.length<2) {
          throw new Error("expected at least 2 values.");
        }
        const d1 = Number(stack.pop());
        const d2 = Number(stack.pop());
        const l = stack.length;
        if(l+1<=d1 || l+1<=d2 || d1<1 || d2<1 || d1===d2) {
          throw new Error("can not swap at depth "+d1+" and "+d2);
        }
        const idx0 = l-d1, idx1 = l-d2;
        const u = stack[idx0];
        stack[idx0] = stack[idx1];
        stack[idx1] = u;
        break;
      }
      case ".": {
        if(!stack.length) {
          throw new Error("expected value to reverse.");
        }
        const size = Number(stack.pop());
        if(stack.length<size) {
          throw new Error("expected "+size+" values to reverse.");
        }
        const original = stack.splice(stack.length-size, stack.length);
        stack.push(...original.reverse());
        break;
      }
      case ">": {
        if(!stack.length) {
          throw new Error("expected value to depth.");
        }
        const depth = Number(stack.pop());
        const l = stack.length;
        if(depth>l) {
          throw new Error("expected at least "+depth+" to push up.");
        }
        stack.push(...stack.splice(l-depth, 1));
        break;
      }
      case "<": {
        if(!stack.length) {
          throw new Error("expected value to depth.");
        }
        const depth = Number(stack.pop());
        const l = stack.length;
        if(depth>l) {
          throw new Error("expected at least "+depth+" to push down.");
        }
        stack.splice(l-depth, 0, stack.pop());
        break;
      }
      default:
        throw new SyntaxError("invalid symbol → "+op.raw);
    }
    if(popst.length) {
      stack.push(...popst.splice(0).reverse());
    }
  }
  
  elt_status.style.color = "white";
  elt_status.value = "";
  try {
    for(const op of parseEso(code)) {
      await interpret(op);
    }
    elt_status.value = "closed with stack at "+stack.length;
    elt_status.style.color = stack.length
      ? "khaki" : "palegreen";
  } catch(e) {
    elt_status.value = e.toString();
    elt_status.style.color = "orangered";
  }
  elt_stdout.value = stdout;
}
